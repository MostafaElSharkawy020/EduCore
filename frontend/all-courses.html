<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse Courses — EduCore</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.search-bar-wrap {
  background: var(--primary); border-radius: 16px;
  padding: 32px; margin-bottom: 28px;
}
.search-bar-wrap h2 { color: white; font-size: 1.6rem; margin-bottom:16px; }
.search-row { display: flex; gap: 12px; }
.search-input {
  flex: 1; padding: 11px 16px; border-radius: 8px;
  border: none; font-family: 'DM Sans',sans-serif; font-size: .95rem;
  outline: none;
}
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.filter-chip {
  padding: 6px 14px; border-radius: 100px; border: 1.5px solid rgba(255,255,255,.2);
  background: transparent; color: rgba(255,255,255,.75);
  font-size: .8rem; font-weight: 500; cursor: pointer; transition: all .18s;
  font-family: 'DM Sans',sans-serif;
}
.filter-chip:hover, .filter-chip.active { background: var(--accent); border-color: var(--accent); color: white; }
.course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 20px; }
.price-tag { font-size: 1rem; font-weight: 700; color: var(--accent); }
.enroll-btn {
  width: 100%; margin-top: 12px; padding: 9px;
  background: var(--primary); color: white; border: none;
  border-radius: 8px; font-family: 'DM Sans',sans-serif;
  font-size: .88rem; font-weight: 600; cursor: pointer;
  transition: background .18s;
}
.enroll-btn:hover { background: var(--accent2); }
.stars { color: #f59e0b; font-size: .85rem; }
</style>
</head>
<body>
<nav class="topnav" id="topnav"></nav>
<aside class="sidebar" id="sidebar"></aside>
<main class="main-content">
<div class="page-inner">

  <div class="search-bar-wrap">
    <h2>Explore Our Courses</h2>
    <div class="search-row">
      <input type="text" class="search-input" id="search-input" placeholder="Search courses, topics, teachers..." oninput="filterCourses()">
      <button class="btn btn-accent">Search</button>
    </div>
    <div class="filter-row">
      <button class="filter-chip active" onclick="setFilter(this,'all')">All Subjects</button>
      <button class="filter-chip" onclick="setFilter(this,'math')">Mathematics</button>
      <button class="filter-chip" onclick="setFilter(this,'science')">Science</button>
      <button class="filter-chip" onclick="setFilter(this,'language')">Language</button>
      <button class="filter-chip" onclick="setFilter(this,'programming')">Programming</button>
      <button class="filter-chip" onclick="setFilter(this,'art')">Arts</button>
    </div>
  </div>

  <div class="flex-between mb-16">
    <div>
      <span style="font-size:.9rem;color:var(--text-muted)" id="result-count">Showing 8 courses</span>
    </div>
    <select class="form-select" style="width:auto;padding:8px 12px" onchange="sortCourses(this.value)">
      <option value="popular">Most Popular</option>
      <option value="price-asc">Price: Low to High</option>
      <option value="price-desc">Price: High to Low</option>
      <option value="newest">Newest</option>
    </select>
  </div>

  <div class="course-grid" id="course-grid">
    <!-- injected -->
  </div>

</div>
</main>

<script src="shared.js"></script>
<script>
const ALL_COURSES = [
  { id:1, title:'Advanced Mathematics', teacher:'Prof. Sarah Mitchell', price:49, enrollable:true, category:'math', students:234, rating:4.8, classes:12, color:'#4f6ef7' },
  { id:2, title:'Introduction to Physics', teacher:'Dr. Alan Park', price:39, enrollable:true, category:'science', students:189, rating:4.6, classes:8, color:'#e8a045' },
  { id:3, title:'English Literature', teacher:'Prof. Jane Doe', price:29, enrollable:true, category:'language', students:156, rating:4.7, classes:10, color:'#22c55e' },
  { id:4, title:'Python Programming', teacher:'Mr. David Kim', price:59, enrollable:true, category:'programming', students:412, rating:4.9, classes:16, color:'#06b6d4' },
  { id:5, title:'Calculus II', teacher:'Prof. Sarah Mitchell', price:54, enrollable:false, category:'math', students:98, rating:4.5, classes:9, color:'#8b5cf6' },
  { id:6, title:'Organic Chemistry', teacher:'Dr. Maria Lopez', price:44, enrollable:true, category:'science', students:127, rating:4.4, classes:11, color:'#f43f5e' },
  { id:7, title:'Creative Writing', teacher:'Ms. Emily Chen', price:34, enrollable:true, category:'language', students:201, rating:4.8, classes:7, color:'#f59e0b' },
  { id:8, title:'Web Development', teacher:'Mr. David Kim', price:69, enrollable:true, category:'programming', students:567, rating:5.0, classes:20, color:'#10b981' },
];

let activeFilter = 'all';
let searchQuery = '';

function setFilter(btn, cat) {
  activeFilter = cat;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  filterCourses();
}

function filterCourses() {
  searchQuery = document.getElementById('search-input').value.toLowerCase();
  let results = ALL_COURSES.filter(c => {
    const matchCat = activeFilter === 'all' || c.category === activeFilter;
    const matchSearch = !searchQuery || c.title.toLowerCase().includes(searchQuery) || c.teacher.toLowerCase().includes(searchQuery);
    return matchCat && matchSearch;
  });
  renderCourses(results);
}

function sortCourses(val) {
  // triggers re-render with sort (simplified)
  filterCourses();
}

function renderCourses(courses) {
  document.getElementById('result-count').textContent = `Showing ${courses.length} course${courses.length!==1?'s':''}`;
  document.getElementById('course-grid').innerHTML = courses.map(c => `
    <div class="course-card" style="cursor:default">
      <a href="course-details.html?id=${c.id}" style="text-decoration:none;display:block">
        <div class="course-card-img" style="background:linear-gradient(135deg,${c.color},var(--primary))">
          <svg width="44" height="44" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="1.5" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <div style="position:absolute;top:12px;right:12px">${c.enrollable ? '<span class="badge badge-green">Open</span>' : '<span class="badge" style="background:rgba(0,0,0,.4);color:white">Closed</span>'}</div>
        </div>
      </a>
      <div class="course-card-body">
        <div class="course-card-title">
          <a href="course-details.html?id=${c.id}" style="text-decoration:none;color:inherit">${c.title}</a>
        </div>
        <div class="course-card-meta" style="margin-bottom:8px">${c.teacher}</div>
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:12px">
          <span class="stars">${'★'.repeat(Math.floor(c.rating))}${'☆'.repeat(5-Math.floor(c.rating))}</span>
          <span style="font-size:.78rem;color:var(--text-muted)">${c.rating} · ${c.students} students</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="price-tag">$${c.price}</span>
          <span style="font-size:.78rem;color:var(--text-muted)">${c.classes} classes</span>
        </div>
        <a href="course-details.html?id=${c.id}" class="enroll-btn" style="display:block;text-align:center;text-decoration:none;color:white;padding:9px;border-radius:8px;margin-top:12px;font-size:.88rem;font-weight:600;background:var(--primary)">
          ${c.enrollable ? 'View & Enroll' : 'View Details'}
        </a>
      </div>
    </div>
  `).join('');
}

document.addEventListener('DOMContentLoaded', () => filterCourses());
</script>
</body>
</html>
